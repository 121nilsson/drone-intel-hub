services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: droneint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-droneint}
      POSTGRES_DB: droneint
    volumes:
      # PostgreSQL 18+ images store data in a major-version-specific subdirectory of
      # /var/lib/postgresql, so the mount has to sit above it (see docker-library/postgres#37).
      - pgdata:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droneint"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      # Keep DATABASE_URL on the internal hostname. Provider settings come from env_file
      # (.env / .env.local) — do not re-list them here with ${VAR:-} or Compose will inject
      # empty strings and wipe values that env_file already loaded.
      DATABASE_URL: postgres://droneint:${POSTGRES_PASSWORD:-droneint}@db:5432/droneint
      PORT: 3010
    ports:
      - "3010:3010"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
