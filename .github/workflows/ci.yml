name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR so re-pushes do not queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Advisory: surfaces formatting drift from Lovable/Bun-generated code without
      # blocking the build. eslint reports the same drift as warnings. Make this blocking
      # by removing continue-on-error — ideally after a one-time `npx prettier --write .`
      # commit has formatted the whole tree.
      - name: Prettier drift (advisory)
        run: npx prettier --check .
        continue-on-error: true

      # The project's tsconfig is already strict with noEmit; this catches type
      # errors the vitest/eslint passes do not (e.g. untested code paths).
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unit tests run against mocked repositories and jsdom, so no database or
      # provider keys are needed. DATABASE_URL-dependent code paths guard on
      # dbConfigured() and skip themselves.
      - name: Run vitest
        run: npm run test
